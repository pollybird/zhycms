# ============================================================
# openAMDC 1.0.0 baseline configuration for the container image.
#
# Only options verified against the pinned upstream commit are used.
# Swapping (RocksDB cold/hot tiering) is disabled by default to keep
# cache latency predictable.
# ============================================================

bind 0.0.0.0
protected-mode no
port 6379
daemonize no

logfile ""
dir /data
databases 16

# Multi-threaded command execution (M0 validated with 4 workers).
worker-threads 4

# Cache semantics: no RDB snapshot / no AOF persistence.
save ""
appendonly no

# Memory ceiling and eviction policy.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Cold/hot tiering off by default.
swap-enabled no

# aarch64 内核 COW 缺陷保护：openAMDC 在 ARM64 上默认拒绝启动，
# 需显式忽略该告警；x86_64 下该配置无影响。
ignore-warnings ARM64-COW-BUG
