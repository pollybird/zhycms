# Flask-Babel 提取配置（v2.3.0 国际化）
# 用法：pybabel extract -F babel.cfg -o app/translations/messages.pot app/
# 输入目录为 app/，故模式相对 app/（**.py / **/templates/**.html）
# 注：Jinja2 3.1（Flask 3.x）已移除 with_ 扩展；{{ _('...') }} 为普通函数调用，
# babel 的 jinja2 提取器默认即识别 _/gettext/ngettext，无需声明 extensions。
[python: **.py]
[jinja2: **/templates/**.html]
