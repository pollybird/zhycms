# Flask-Babel 提取配置（v2.3.0 国际化，核心 + 插件独立翻译域）
#
# --- 核心目录 app/ ---
#   pybabel extract -F babel.cfg \
#       -k _ -k _gettext -k gettext -k lazy_gettext -k ngettext:1,2 \
#       -o app/translations/messages.pot app/
#   输入目录为 app/，**=全目录；新增语种：pybabel init -i pot -d app/translations -l ja
#   修改后同步：pybabel update -i pot -d app/translations -l en --previous
#   部署前编译：pybabel compile -f -d app/translations -l en
#
# --- 插件目录 plugins/<slug>/（独立翻译域，插件自己的 translations 目录）---
#   ⚠️ Babel 的 Jinja 提取器只识别 _ / gettext / ngettext，**不识别插件模板的
#      {{ _p('<slug>', '原文') }}**。因此插件 POT 生成需「两步骤合并」：
#      ① 正则扫描 templates/ 匹配 _p(slug_literal, msg_literal) 取 msgid；
#      ② pybabel 扫 Python 层识别 self._() / gettext() / lazy_gettext()；
#      ③ 去重合并为 plugins/<slug>/translations/messages.pot
#      再按常规 pybabel init/update/compile -d plugins/<slug>/translations -l en
#
#   仅 pybabel 扫 Python 层部分的最小命令（_p 模板需要自行补进 pot）：
#     pybabel extract -F babel.cfg \
#         -k _ -k gettext -k lazy_gettext -k ngettext:1,2 \
#         -o plugins/<slug>/translations/_babel_raw.pot plugins/<slug>/
#
[python: **.py]
encoding = utf-8
[jinja2: **/templates/**.html]
encoding = utf-8
extensions =
