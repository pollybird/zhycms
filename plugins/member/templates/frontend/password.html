{% extends theme_base %}
{% block title %}{{ _('修改密码') }} - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="py-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('frontend.index') }}">{{ _('首页') }}</a></li>
      <li class="breadcrumb-item"><a href="{{ url_for('member_frontend.center') }}">{{ _('会员中心') }}</a></li>
      <li class="breadcrumb-item active">{{ _('修改密码') }}</li>
    </ol>
  </nav>

  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-header">{{ _('修改登录密码') }}</div>
        <div class="card-body">
          <form method="post">
            <div class="form-group">
              <label>{{ _('原密码') }}</label>
              <input type="password" name="old_password" class="form-control" required>
            </div>
            <div class="form-group">
              <label>{{ _('新密码') }}</label>
              <input type="password" name="new_password" class="form-control" required>
              <small class="text-muted">{{ _('至少 6 位') }}</small>
            </div>
            <div class="form-group">
              <label>{{ _('确认新密码') }}</label>
              <input type="password" name="password_confirm" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ _('确认修改') }}</button>
            <a href="{{ url_for('member_frontend.center') }}" class="btn btn-default">{{ _('返回') }}</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
