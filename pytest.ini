[pytest]
testpaths = tests
addopts = -q --strict-markers --timeout=120
markers =
    smoke: 基础冒烟测试
    auth: 认证与权限测试
    workflow: 工作流测试
    search: 搜索测试
    i18n: 国际化测试
    plugins: 插件测试
    api: REST API 测试
    errors: 异常处理测试
    constants: 常量治理测试
    boundary: RBAC 栏目级权限边界测试
    lifecycle: 插件生命周期测试
    migration: Alembic 迁移测试
    contract: API 契约测试
    storage: 存储驱动抽象层测试
