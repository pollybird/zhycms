# ============================================================
# zhycms Docker Compose — MySQL 版（独立文件，无需 --profile）
# 用法：
#   cp docker/.env.example .env   # 按需修改 SECRET_KEY / MYSQL_PASSWORD
#   docker compose -f docker-compose.mysql.yml up -d
#
# 镜像：pollybird/zhycms:mysql（已含 MySQL / PostgreSQL 驱动，靠 DB_URI 切换）
# 本地重新构建：docker compose -f docker-compose.mysql.yml build
# ============================================================

services:
  app:
    image: pollybird/zhycms:mysql
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        APT_MIRROR: ${APT_MIRROR:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      ZHYCMS_ENV: production
      ZHYCMS_SECRET_KEY: ${SECRET_KEY:-changeme}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      REDIS_URL: ${REDIS_URL:-}
      ZHYCMS_DB_URI: mysql+pymysql://zhycms:${MYSQL_PASSWORD:-zhycms}@db:3306/zhycms?charset=utf8mb4
    volumes:
      - ./instance:/app/instance
      - ./app/static/uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: zhycms
      MYSQL_USER: zhycms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhycms}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis（可选，取消注释启用；启用后缓存与 Session 走 Redis）----
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3

volumes:
  mysql_data:
  # redis_data:
