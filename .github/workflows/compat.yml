name: Compatibility

# v3.3.0 信创适配：openGauss + openAMDC 兼容性验证。
# v3.3.3：新增 PolarDB for PostgreSQL（Apache 2.0）迁移与备份恢复验证。
# 与 ci.yml 的 Python 矩阵解耦，只在相关路径变化时运行，控制耗时。

on:
  push:
    branches: [main]
    paths:
      - 'app/config.py'
      - 'app/utils/dbconfig.py'
      - 'app/utils/backup_utils.py'
      - 'app/utils/dialects/**'
      - 'app/services/redis_backend.py'
      - 'app/services/runtime_guard.py'
      - 'app/frontend/views.py'
      - 'app/admin/system/setting.py'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - 'tests/test_opengauss_v330.py'
      - 'tests/test_redis_backend_v330.py'
      - 'tests/test_openamdc_v330.py'
      - 'tests/test_polardb.py'
      - 'tests/test_compat_integration.py'
      - '.github/workflows/compat.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  openamdc:
    name: openAMDC full test suite
    runs-on: ubuntu-latest
    services:
      openamdc:
        image: pollybird/openamdc:1.0.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "openamdc-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 6

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify delivered image is the pinned build
        run: |
          CONTAINER_ID="$(docker ps -q --filter ancestor=pollybird/openamdc:1.0.0)"
          test -n "$CONTAINER_ID"
          docker exec "$CONTAINER_ID" openamdc-cli INFO server \
            | tee /tmp/openamdc-info.txt
          grep -q '^openamdc_git_sha1:6758505d' /tmp/openamdc-info.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run full suite against openAMDC
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          ZHYCMS_TEST_OPENAMDC_URL: redis://127.0.0.1:6379/0
        run: pytest tests -q --timeout=120

  opengauss:
    name: openGauss migration smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            og_image: pollybird/opengauss:7.0.0
            og_py_url: https://opengauss.obs.cn-south-1.myhuaweicloud.com/7.0.0/openEuler22.03/x86/openGauss-Python-7.0.0-openEuler22.03-x86_64.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            og_image: pollybird/opengauss:7.0.0
            og_py_url: https://opengauss.obs.cn-south-1.myhuaweicloud.com/7.0.0/openEuler22.03/arm/openGauss-Python-7.0.0-openEuler22.03-aarch64.tar.gz

    env:
      OPENGAUSS_PASSWORD: Zhycms-2026og
      OPENGAUSS_URL: opengauss+psycopg2://gaussdb:Zhycms-2026og@127.0.0.1:5432/zhycms
      OPENGAUSS_PY_URL: ${{ matrix.og_py_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Pull openGauss image
        run: |
          IMG="${{ matrix.og_image }}"
          docker pull "$IMG"
          docker tag "$IMG" og-run:local
          # 多架构镜像已内置 openblas / libatomic，无需再安装运行时依赖。

      - name: Start openGauss
        run: |
          docker run -d --name opengauss --privileged \
            -p 5432:5432 \
            -e GS_PASSWORD="$OPENGAUSS_PASSWORD" \
            -e GS_DB=zhycms \
            og-run:local

      - name: Wait for openGauss ready
        run: |
          for attempt in $(seq 1 60); do
            if docker exec opengauss bash -lc \
              'LD_LIBRARY_PATH=/usr/local/opengauss/lib /usr/local/opengauss/bin/gsql -d postgres -U gaussdb -W "$GS_PASSWORD" -tAc "select 1"' >/dev/null 2>&1; then
              echo "openGauss ready (attempt ${attempt})"
              exit 0
            fi
            sleep 5
          done
          docker logs opengauss
          exit 1

      - name: Install dependencies and openGauss driver
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python - "$OPENGAUSS_PY_URL" <<'PY'
          import sys
          import tarfile
          import urllib.request
          from pathlib import Path

          url = sys.argv[1]
          target = Path('/tmp/ogpy.tar.gz')
          urllib.request.urlretrieve(url, target)
          Path('/tmp/ogpython').mkdir(exist_ok=True)
          tarfile.open(target).extractall('/tmp/ogpython')
          PY
          SITE="$(python -c 'import site; print(site.getsitepackages()[0])')"
          pip uninstall -y psycopg2 psycopg2-binary || true
          rm -rf "$SITE/psycopg2" "$SITE/psycopg2_binary.libs"
          cp -r /tmp/ogpython/psycopg2 "$SITE/psycopg2"
          rm -f /tmp/ogpython/lib/libstdc++.so.6 \
                /tmp/ogpython/lib/libssl.so.3 \
                /tmp/ogpython/lib/libcrypto.so.3
          echo "LD_LIBRARY_PATH=/tmp/ogpython/lib" >> "$GITHUB_ENV"

      - name: Run migration smoke
        env:
          ZHYCMS_ENV: production
          ZHYCMS_SECRET_KEY: ci-only-secret-key
          ZHYCMS_DB_URI: opengauss+psycopg2://gaussdb:Zhycms-2026og@127.0.0.1:5432/zhycms
        run: |
          python -c "from app import create_app; create_app(); print('migration ok')"
          python - "$OPENGAUSS_URL" <<'PY'
          import sys

          from sqlalchemy import create_engine, text

          from app.utils.dialects import register_opengauss_dialect

          register_opengauss_dialect()
          engine = create_engine(sys.argv[1], pool_pre_ping=True)
          with engine.connect() as conn:
              revision = conn.execute(text('select version_num from alembic_version')).scalar()
              tables = conn.execute(text(
                  "select count(*) from information_schema.tables "
                  "where table_schema = 'public'")).scalar()
          print(f'alembic={revision} tables={tables}')
          assert revision == '0021', revision
          assert tables >= 40, tables
          PY

      - name: Run compatibility tests
        env:
          ZHYCMS_TEST_OPENGAUSS_URL: opengauss+psycopg2://gaussdb:Zhycms-2026og@127.0.0.1:5432/zhycms
        run: pytest tests/test_compat_integration.py tests/test_opengauss_v330.py -q --timeout=120

  polardb:
    name: PolarDB-PG migration smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    env:
      POLARDB_PASSWORD: Zhycms-2026pdb
      POLARDB_URL: polardb_pg+psycopg2://zhycms:Zhycms-2026pdb@127.0.0.1:5432/zhycms
      ZHYCMS_SECRET_KEY: ci-only-secret-key

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Pull PolarDB image
        run: docker pull polardb/polardb_pg_binary:15

      - name: Start PolarDB
        run: |
          mkdir -p .ci/polardb
          chmod 777 .ci/polardb
          docker run -d --name polardb --privileged --cap-add=SYS_PTRACE \
            -p 5432:5432 \
            -v "$PWD/.ci/polardb:/var/polardb" \
            -v "$PWD/docker/polardb/init.sh:/opt/polardb-init.sh:ro" \
            -e POLARDB_PORT=5432 \
            -e POLARDB_USER=zhycms \
            -e POLARDB_DB=zhycms \
            -e POLARDB_PASSWORD="$POLARDB_PASSWORD" \
            --user root \
            polardb/polardb_pg_binary:15 \
            bash /opt/polardb-init.sh

      - name: Wait for PolarDB ready
        run: |
          for attempt in $(seq 1 60); do
            if docker exec polardb /u01/polardb_pg/bin/pg_isready \
              -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PolarDB ready (attempt ${attempt})"
              exit 0
            fi
            sleep 5
          done
          docker logs polardb
          exit 1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migration smoke
        env:
          ZHYCMS_ENV: production
          ZHYCMS_SECRET_KEY: ci-only-secret-key
          ZHYCMS_DB_URI: polardb_pg+psycopg2://zhycms:Zhycms-2026pdb@127.0.0.1:5432/zhycms
        run: |
          python -c "from app import create_app; create_app(); print('migration ok')"
          python - "$POLARDB_URL" <<'PY'
          import sys

          from sqlalchemy import create_engine, text

          from app.utils.dialects import register_polardb_dialect

          register_polardb_dialect()
          engine = create_engine(sys.argv[1], pool_pre_ping=True)
          with engine.connect() as conn:
              revision = conn.execute(text('select version_num from alembic_version')).scalar()
              tables = conn.execute(text(
                  "select count(*) from information_schema.tables "
                  "where table_schema = 'public'")).scalar()
          print(f'alembic={revision} tables={tables}')
          assert revision == '0021', revision
          assert tables >= 40, tables
          PY

      # 使用镜像内自带的 PG15 客户端（与应用镜像 pollybird/zhycms:polardb 一致）：
      # runner 默认 apt 源可能装到 PG17 客户端，其 dump 头部含 PG17 才有的
      # `SET transaction_timeout`，恢复到 PG15 会直接失败。
      - name: Backup / restore smoke
        run: |
          PGBIN=/u01/polardb_pg/bin
          docker exec -e PGPASSWORD="$POLARDB_PASSWORD" polardb \
            $PGBIN/pg_dump -h 127.0.0.1 -p 5432 -U zhycms -d zhycms --no-owner > /tmp/zhycms.sql
          grep -q 'CREATE TABLE' /tmp/zhycms.sql
          docker exec -e PGPASSWORD="$POLARDB_PASSWORD" polardb \
            $PGBIN/psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c 'CREATE DATABASE zhycms_restore'
          docker exec -i -e PGPASSWORD="$POLARDB_PASSWORD" polardb \
            $PGBIN/psql -h 127.0.0.1 -p 5432 -U postgres -d zhycms_restore \
            -v ON_ERROR_STOP=1 -q < /tmp/zhycms.sql
          TABLES=$(docker exec -e PGPASSWORD="$POLARDB_PASSWORD" polardb \
            $PGBIN/psql -tA -h 127.0.0.1 -p 5432 -U postgres -d zhycms_restore \
            -c "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "restored tables=$TABLES"
          test "$TABLES" -ge 40
          docker exec -e PGPASSWORD="$POLARDB_PASSWORD" polardb \
            $PGBIN/psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c 'DROP DATABASE zhycms_restore'

      - name: Run compatibility tests
        env:
          ZHYCMS_TEST_POLARDB_URL: polardb_pg+psycopg2://zhycms:Zhycms-2026pdb@127.0.0.1:5432/zhycms
        run: pytest tests/test_polardb.py -q --timeout=300
