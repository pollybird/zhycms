name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'wiki.html'
      - 'docs/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # v3.1.4：矩阵扩展至 3.13/3.14；3.14 暂为实验性——spacy-pkuseg 1.0.1
        # 尚无 cp314 预编译 wheel（需源码编译），待其补齐后移入必过列表
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python-version: '3.14'
            experimental: true

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --timeout=120 -q

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check release version consistency
        run: python scripts/check_release.py --version "$(python scripts/check_release.py --print-version)"

  constants-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
      - name: Check no hardcoded constants
        run: python scripts/check_constants.py

  excepts-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
      - name: Check no silent exception swallowing
        run: python scripts/check_excepts.py

  coverage:
    # v3.1.7：覆盖率门禁固定 Python 3.12。spacy-pkuseg 为 Cython 扩展，
    # 在部分版本与 coverage 追踪核心冲突；--no-cython 用纯 Python 分词
    # 兜底，保证覆盖率可采集。阈值 50% 为当前基线，后续逐步提高。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        run: |
          pytest --no-cython --cov=app --cov=plugins \
            --cov-report=term-missing --cov-fail-under=50
