{% if pagination.pages > 1 %}
<nav class="mt-3">
  <ul class="pagination pagination-sm justify-content-center">
    <li class="page-item {{ 'disabled' if not pagination.has_prev }}">
      <a class="page-link" href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.prev_num if pagination.has_prev else 1)) }}">&laquo;</a>
    </li>
    {% for p in pagination.iter_pages(left_edge=1, right_edge=1, left_current=2, right_current=2) %}
      {% if p %}
        <li class="page-item {{ 'active' if p == pagination.page }}">
          <a class="page-link" href="{{ url_for(request.endpoint, **dict(request.args, page=p)) }}">{{ p }}</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">…</span></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {{ 'disabled' if not pagination.has_next }}">
      <a class="page-link" href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.next_num if pagination.has_next else pagination.page)) }}">&raquo;</a>
    </li>
  </ul>
</nav>
{% endif %}
