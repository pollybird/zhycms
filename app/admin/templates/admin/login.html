<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>登录 - {{ cms_name }} 管理后台</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-box { width: 380px; }
    .login-logo a { color: #495057; }
    .login-card-body { border-radius: 4px; }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <a href="#"><b>{{ cms_name }}</b></a>
  </div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">请登录管理后台</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ msg }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" autocomplete="off">
        <div class="input-group mb-3">
          <input type="text" name="username" class="form-control" placeholder="账号" value="{{ username or '' }}" required autofocus>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-user"></span></div></div>
        </div>
        <div class="input-group mb-3">
          <input type="password" name="password" class="form-control" placeholder="密码" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-lock"></span></div></div>
        </div>
        <div class="input-group mb-3">
          <input type="text" name="captcha" class="form-control" placeholder="验证码（不区分大小写）" required>
          <div class="input-group-append"><img id="captcha-img" src="{{ url_for('admin_auth.captcha') }}" alt="验证码" title="点击刷新" style="cursor:pointer;height:38px;border-radius:0 .25rem .25rem 0;"></div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">登录</button>
          </div>
        </div>
      </form>
      <p class="mt-3 mb-0 text-muted text-center" style="font-size:12px;">
        钟毓企业网站CMS · 版权所有：泰州姜堰钟毓信息技术有限公司
      </p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script>
  $('#captcha-img').on('click', function(){
    this.src = "{{ url_for('admin_auth.captcha') }}?t=" + Date.now();
  });
</script>
</body>
</html>
