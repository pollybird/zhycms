{% set _links = friend_links() if friend_links is defined else [] %}
{% if _links %}
<div class="zbw-friend-links" {{ node_attrs() }}>
  <h4><i class="fas fa-link"></i> 友情链接</h4>
  <ul class="list-inline">
    {% for l in _links %}
    <li class="list-inline-item mr-3">
      <a href="{{ l.url }}" target="{{ l.target or '_self' }}">
        {% if l.logo %}<img src="{{ l.logo }}" alt="{{ t(l, 'name') }}" class="zbw-friend-logo">{% else %}{{ t(l, 'name') }}{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% elif preview %}
<div class="zbw-placeholder" {{ node_attrs() }}><i class="fas fa-link"></i> 友情链接插件未启用或暂无链接</div>
{% endif %}
